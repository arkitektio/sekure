appId: io.jhnnsrs.sekure
productName: Sekure
electronVersion: 43.1.0
electronLanguages: ['en', 'en-US']
publish:
  provider: github
  owner: jhnnsrs
  repo: sekure
  releaseType: release
# "next" rides the standard beta.yml carrier (see AppUpdater.ts).
generateUpdatesFilesForAllChannels: true
directories:
  buildResources: build
# Everything the main process needs is bundled into out/ (externalizeDeps:
# false in electron.vite.config.ts), so no node_modules ship in the asar.
files:
  - out/**/*
  - package.json
  - '!**/node_modules/**/*'
asar: true
# Lock the shipped binary down so a local process can't run code under
# Sekure's signature (ELECTRON_RUN_AS_NODE, --inspect, NODE_OPTIONS) and read
# the safeStorage secrets without Touch ID.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
# onnxruntime-web imports and reads its WASM runtime from disk (smart search).
# The bundled search model is read by a worker thread; unpacked, it is still sealed
# by the macOS code signature, and the worker checks it against its sha256 pins.
asarUnpack:
  - out/main/ort/**
  - out/main/models/**
win:
  executableName: sekure
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # zip is required for electron-updater on macOS
  target: [dmg, zip]
  category: public.app-category.productivity
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  extendInfo:
    NSAppleEventsUsageDescription: Sekure presses ⌘V in the app you were typing in to auto-type a field.
dmg:
  artifactName: ${name}-${version}.${ext}
  sign: true
linux:
  target: [AppImage, deb]
  maintainer: jhnnsrs
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
afterPack: scripts/remove-locales.cjs
