# pnpm 11 reads settings from here, not from package.json.
overrides:
  # react-router must be a single instance or <Routes> loses its context.
  react-router: 6.30.4

# pnpm 10+ blocks dependency lifecycle scripts unless they are listed here.
#   esbuild             - postinstall resolves the platform binary; vite needs it
#   electron-winstaller - install script picks the 7-Zip arch
#   msw                 - transitive (shadcn); postinstall not needed
allowBuilds:
  electron-winstaller: true
  esbuild: true
  msw: false
  protobufjs: false
