<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sekure</title>
    <!-- Nothing leaves the renderer: all network traffic happens in main.
         blob: is for previewing decrypted image/PDF attachments. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self' data:; frame-src blob:; object-src blob:; connect-src 'self' ws://localhost:*"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
