name: Publish a Release
on:
  release:
    types: [published, prereleased] # stable from main, prerelease from next
  workflow_dispatch: {} # dry-run the packaging matrix (main / next only, see `if:`)

# Upload release assets only. Secrets are scoped to the build steps below, so
# `pnpm install` (and any dependency install script) never sees them.
permissions:
  contents: write

jobs:
  release:
    # A manual dry run builds signed, notarized apps: only from reviewed branches.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Must run before setup-node, and stay on PATH: electron-builder's
      # PnpmNodeModulesCollector shells out to `pnpm list --prod --json`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: build-linux
        if: matrix.os == 'ubuntu-latest'
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GH_TOKEN: ${{ github.token }} # electron-builder reads GH_TOKEN
          # Baked into the main bundle at build time (import.meta.env.MAIN_VITE_*).
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAIN_VITE_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MAIN_VITE_GOOGLE_APP_ID: ${{ secrets.GOOGLE_APP_ID }}
        run: pnpm run build:linux

      # Import the signing cert ourselves instead of passing CSC_LINK.
      # electron-builder 26.9's importCerts calls `security set-key-partition-list
      # -k <CSC_KEY_PASSWORD>`, but -k wants the *keychain* password, not the
      # p12 password -> "SecKeychainUnlock: passphrase not correct" on macOS 26
      # runners. Pointing it at a prepared keychain via CSC_KEYCHAIN skips that.
      - name: import-mac-cert
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/cert.p12"
          echo "$CSC_LINK" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$CERT"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: build-mac
        if: matrix.os == 'macos-latest'
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GH_TOKEN: ${{ github.token }} # electron-builder reads GH_TOKEN
          # Baked into the main bundle at build time (import.meta.env.MAIN_VITE_*).
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAIN_VITE_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MAIN_VITE_GOOGLE_APP_ID: ${{ secrets.GOOGLE_APP_ID }}
          # Notarization (auto-detected by electron-builder)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run build:mac

      - name: build-win
        if: matrix.os == 'windows-latest'
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GH_TOKEN: ${{ github.token }} # electron-builder reads GH_TOKEN
          # Baked into the main bundle at build time (import.meta.env.MAIN_VITE_*).
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAIN_VITE_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MAIN_VITE_GOOGLE_APP_ID: ${{ secrets.GOOGLE_APP_ID }}
        run: pnpm run build:win
