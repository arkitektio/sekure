name: Release

on:
  push:
    branches: [main, next]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commit, tag and GitHub release
      issues: write # release comments on fixed issues
      pull-requests: write
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # semantic-release needs full history
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Run semantic-release
        env:
          # The built-in token. A release it creates does not trigger other
          # workflows, so the build below is started from here instead.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git tag --list 'v*' | sort > "$RUNNER_TEMP/tags-before"
          pnpm exec semantic-release
          git tag --list 'v*' | sort > "$RUNNER_TEMP/tags-after"
      - name: Find the new release
        id: released
        run: |
          tag=$(comm -13 "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after" | tail -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then echo "Released $tag"; else echo "No new release"; fi

  # Build, sign and upload the apps for the release just created.
  publish:
    needs: semantic-release
    if: needs.semantic-release.outputs.tag != ''
    permissions:
      contents: write # upload release assets
    uses: ./.github/workflows/publishall.yaml
    with:
      tag: ${{ needs.semantic-release.outputs.tag }}
    secrets: inherit
